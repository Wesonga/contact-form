<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Student Support</div>
        <nav>
            <a href="#home">Home</a>
            <a href="#help">Help</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <hr>

    <!-- main contact form section -->
     <main>
        <h1>Contact Us</h1>
        <p class="subtitle">Send us a message and we will get back to you.</p>

        <form action="#" method="POST">
            <!-- Full Name -->
            <div class="form-group">
                <label for="fullname">Full name</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <!-- Subject -->
            <div class="form-group">
                <label for="subject">Subject</label>
                <select id="subject" name="subject" required>
                    <option value="" disabled selected>Choose a topic</option>
                    <option value="general">General Inquiry</option>
                    <option value="billing">Billing Question</option>
                    <option value="technical">Technical Support</option>
                </select>
            </div>

            <!-- Message -->
            <div class="form-group align-top">
                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>
            </div>

            <!-- Radio Options -->
            <div class="radio-section">
                <p>How did you hear about us?</p>
                
                <label class="radio-group">
                    <input type="radio" name="referral" value="search"> Search
                </label>
                
                <label class="radio-group">
                    <input type="radio" name="referral" value="friend"> Friend
                </label>
                
                <label class="radio-group">
                    <input type="radio" name="referral" value="social"> Social media
                </label>
            </div>

            <!-- Checkbox Option -->
            <div style="margin-top: 5px;">
                <label class="checkbox-group">
                    <input type="checkbox" name="updates" value="yes"> Send me product updates
                </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Send message</button>
        </form>
     </main>

     <footer>
        <p>&copy; 2024 Student Support. All rights reserved.</p>
     </footer>
    
</body>
</html>
